name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DownloadAja.sln

      - name: Build
        run: dotnet build DownloadAja.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/DownloadAja.Core.Tests/DownloadAja.Core.Tests.csproj --configuration Release --no-build --verbosity normal
