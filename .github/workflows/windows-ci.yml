name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DownloadAja.sln

      - name: Build
        run: dotnet build DownloadAja.sln --configuration Release --no-restore

      - name: Unit and persistence tests
        run: dotnet test DownloadAja.sln --configuration Release --no-build --verbosity normal

      - name: Validate Chrome MV3 integration assets
        shell: pwsh
        run: |
          node --check browser-extension/chrome-mv3/service_worker.js
          node --check browser-extension/chrome-mv3/options.js
          node browser-extension/validate.mjs

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/install-chrome-integration.ps1'),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/uninstall-chrome-integration.ps1'),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Fetch official aria2 1.37.0 Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'aria2-1.37.0-win-64bit-build1.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'aria2-1.37.0'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem -Path $extract -Recurse -Filter aria2c.exe | Select-Object -First 1
          if (-not $exe) { throw 'aria2c.exe was not found in the official release archive.' }
          & $exe.FullName --version
          "DOWNLOAD_AJA_ARIA2_PATH=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Real aria2 HTTPS integration
        shell: pwsh
        env:
          DOWNLOAD_AJA_RUN_ARIA2_INTEGRATION: '1'
        run: dotnet test tests/DownloadAja.Infrastructure.Tests/DownloadAja.Infrastructure.Tests.csproj --configuration Release --no-build --filter "Category=Aria2Integration" --verbosity normal
